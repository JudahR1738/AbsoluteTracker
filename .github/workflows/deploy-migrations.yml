name: Deploy Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/schemas/**"
      - ".github/workflows/deploy-migrations.yml"
  workflow_dispatch:

jobs:
  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        run: |
          supabase db push \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Migration succeeded
        if: success()
        run: echo "✅ Migrations applied to project $SUPABASE_PROJECT_ID"

      - name: Migration failed
        if: failure()
        run: |
          echo "❌ Migration failed — check logs above."
          echo "Common causes:"
          echo "  - Missing GitHub Secrets"
          echo "  - Conflicting schema changes"
          echo "  - Supabase project is paused"
          exit 1